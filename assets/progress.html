<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Builder Method · Progress</title>
<style>
:root {
  --paper: #fbf8f1; --ink: #23201b; --ink-2: #5d574d; --line: #d9d2c3;
  --accent: #2f5bd3; --accent-t: #e3eafc; --done: #2f8a4c; --done-t: #e2f2e7;
  --warn: #b5541c; --warn-t: #fbe9dc; --na: #9a958b; --card: #fffdf8;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #1b1a17; --ink: #f1ece2; --ink-2: #b9b2a5; --line: #3a372f;
    --accent: #8fb0ff; --accent-t: #26304a; --done: #7fd39a; --done-t: #1f3327;
    --warn: #f0a46f; --warn-t: #3d2a1d; --na: #7c776d; --card: #23221e;
  }
}
:root[data-theme="dark"] {
  --paper: #1b1a17; --ink: #f1ece2; --ink-2: #b9b2a5; --line: #3a372f;
  --accent: #8fb0ff; --accent-t: #26304a; --done: #7fd39a; --done-t: #1f3327;
  --warn: #f0a46f; --warn-t: #3d2a1d; --na: #7c776d; --card: #23221e;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink);
  font: 16px/1.5 ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 1040px; margin: 0 auto; padding: 32px 16px 48px; }
.top .brand { margin: 0; color: var(--ink-2); font-size: 14px; letter-spacing: .08em; text-transform: uppercase; }
.top h1 { margin: 4px 0 0; font-size: clamp(26px, 5vw, 40px); line-height: 1.15; overflow-wrap: anywhere; }
.top .meta { margin: 4px 0 24px; color: var(--ink-2); }
.board { position: relative; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 28px 24px; }
.card { position: relative; padding: 18px 18px 16px; background: var(--card); border-radius: 6px; min-height: 190px; }
.card > svg.outline { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.card > svg.outline path { fill: none; stroke: var(--ink); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.card.current > svg.outline path { stroke: var(--accent); stroke-width: 2.2; }
.card.na > svg.outline path { stroke-dasharray: 6 6; }
.card header { display: flex; gap: 12px; align-items: center; }
.num { flex: none; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center;
  font-weight: 700; background: var(--accent-t); color: var(--accent); }
.st-done .num { background: var(--done-t); color: var(--done); }
.st-skipped_generated .num { background: var(--warn-t); color: var(--warn); }
.eyebrow { margin: 0; font-size: 12px; color: var(--ink-2); }
.card h2 { margin: 0; font-size: 20px; }
.here { margin: 10px 0 0; font-weight: 700; color: var(--accent); }
.status { margin: 10px 0 6px; font-weight: 600; }
.bar { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
.bar span { display: block; height: 100%; background: var(--accent); }
.st-done .bar span { background: var(--done); }
.st-skipped_generated .bar span { background: var(--warn); }
.file, .missing { margin: 8px 0 0; font-size: 14px; color: var(--ink-2); overflow-wrap: anywhere; }
.file a { color: var(--accent); }
.debt-badge { display: inline-block; margin: 10px 0 0; padding: 2px 10px; border-radius: 999px; font-size: 13px;
  font-weight: 600; background: var(--warn-t); color: var(--warn); }
.card.na { opacity: .55; }
.card.na .bar { display: none; }
.card.na .num { background: var(--line); color: var(--na); }
.loop { position: absolute; margin: 0; color: var(--accent); font-size: 14px; font-weight: 600;
  left: 50%; top: 100%; transform: translate(-50%, 4px); white-space: nowrap; }
.totals { display: flex; flex-wrap: wrap; gap: 8px 24px; margin: 48px 0 8px; color: var(--ink-2); }
.totals p { margin: 0; }
.flows h3 { margin: 24px 0 8px; }
.flows table { width: 100%; border-collapse: collapse; font-size: 15px; }
.flows th, .flows td { text-align: left; padding: 8px 10px 8px 0; border-bottom: 1px solid var(--line); vertical-align: top; overflow-wrap: anywhere; }
.flows th { color: var(--ink-2); font-weight: 600; font-size: 13px; }
.v-pass td:last-child { color: var(--done); font-weight: 600; }
.v-fail td:last-child { color: var(--warn); font-weight: 600; }
.next { margin-top: 32px; }
code { font: 14px ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--accent-t); color: var(--accent); padding: 2px 6px; border-radius: 4px; }
.error { padding: 32px; background: var(--warn-t); border-radius: 8px; }
.error h1 { margin-top: 0; font-size: 24px; }
@media (max-width: 760px) {
  .board { grid-template-columns: minmax(0, 1fr); gap: 20px; }
  .loop { position: static; transform: none; text-align: center; }
  .flows table { font-size: 14px; }
}
@media (min-width: 761px) and (max-width: 980px) {
  .board { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
</style>
</head>
<body>
<main aria-live="polite"></main>
<script src="progress-data.js"></script>
<script>
(function () {
// UI strings for builder/progress.html. Add a language by adding a key with the same shape.
const STRINGS = {
  en: {
    title: 'Builder Method',
    phases: { idea: 'Idea', prd: 'PRD', design: 'Design', build: 'Build', iterate: 'Iterate', ship: 'Ship' },
    status: {
      not_started: 'Not started',
      in_progress: 'In progress',
      done: 'Done',
      skipped_generated: 'Generated, not reviewed',
      not_applicable: 'Not needed',
    },
    steps: {
      explore: 'explore', scope: 'scope', summarize: 'summarize',
      clarify: 'clarify', write: 'write', review: 'review', polish: 'polish',
      prototype: 'design', validate: 'validate', link: 'link',
      plan: 'plan', setup: 'setup', build: 'build',
      decisions: 'decisions', triage: 'triage', loop: 'loop',
      audit: 'audit', remote: 'remote', prepare: 'prepare', deploy: 'deploy', domain: 'domain', record: 'record',
    },
    youAreHere: 'You are here',
    cycle: 'cycle',
    phaseOf: (n) => `Phase ${n} of 6`,
    deliverable: 'Deliverable',
    pendingSteps: 'Still to do',
    tasksLeft: 'Tasks left',
    flowsToValidate: 'Flows to validate',
    notNeeded: 'This product has no screens.',
    unreviewed: 'Not reviewed',
    reviewWith: (cmd) => `Generated without review. Review it with ${cmd}.`,
    flows: 'User flows',
    flow: 'Flow',
    name: 'Name',
    tasks: 'Tasks',
    validation: 'Validation',
    validationStatus: { pending: 'pending', pass: 'pass', fail: 'fail' },
    noFlows: 'No flows yet. They are defined in the PRD.',
    decisionsPending: (n) => `${n} decision${n === 1 ? '' : 's'} to review`,
    covered: (c, t) => `${c} of ${t} flows covered by tasks`,
    validated: (v, t) => `${v} of ${t} flows validated`,
    next: 'Next step',
    loop: 'repeat the cycle ↺',
    errorTitle: 'The project state could not be read',
    errorBody: 'builder/state.json is missing or damaged. Ask Claude to run /builder:status to repair this page.',
  },
  es: {
    title: 'Método Builder',
    phases: { idea: 'Idea', prd: 'PRD', design: 'Diseño', build: 'Construcción', iterate: 'Iteración', ship: 'Publicación' },
    status: {
      not_started: 'Sin empezar',
      in_progress: 'En curso',
      done: 'Hecha',
      skipped_generated: 'Generada, sin revisar',
      not_applicable: 'No aplica',
    },
    steps: {
      explore: 'explorar', scope: 'acotar', summarize: 'resumir',
      clarify: 'concretar', write: 'escribir', review: 'revisar', polish: 'pulir',
      prototype: 'diseñar', validate: 'validar', link: 'enlazar',
      plan: 'planificar', setup: 'preparar', build: 'construir',
      decisions: 'decisiones', triage: 'clasificar', loop: 'repetir',
      audit: 'auditar', remote: 'repositorio', prepare: 'preparar', deploy: 'desplegar', domain: 'dominio', record: 'documentar',
    },
    youAreHere: 'Estás aquí',
    cycle: 'ciclo',
    phaseOf: (n) => `Fase ${n} de 6`,
    deliverable: 'Entregable',
    pendingSteps: 'Falta',
    tasksLeft: 'Tareas pendientes',
    flowsToValidate: 'Flujos por validar',
    notNeeded: 'Este producto no tiene pantallas.',
    unreviewed: 'Sin revisar',
    reviewWith: (cmd) => `Generado sin revisión. Revísalo con ${cmd}.`,
    flows: 'Flujos de usuario',
    flow: 'Flujo',
    name: 'Nombre',
    tasks: 'Tareas',
    validation: 'Validación',
    validationStatus: { pending: 'pendiente', pass: 'superado', fail: 'falla' },
    noFlows: 'Aún no hay flujos. Se definen en el PRD.',
    decisionsPending: (n) => `${n} decisi${n === 1 ? 'ón' : 'ones'} por revisar`,
    covered: (c, t) => `${c} de ${t} flujos cubiertos por tareas`,
    validated: (v, t) => `${v} de ${t} flujos validados`,
    next: 'Siguiente paso',
    loop: 'repetir el ciclo ↺',
    errorTitle: 'No se pudo leer el estado del proyecto',
    errorBody: 'Falta builder/state.json o está dañado. Pide a Claude que ejecute /builder:status para reparar esta página.',
  },
};

function strings(lang) {
  const base = String(lang || 'en').slice(0, 2);
  return STRINGS[base] || STRINGS.en;
}

// Pure renderer for builder/progress.html. No DOM, no clock, no randomness:
// identical state + language always produce identical markup.


const PHASES = [
  { id: 'idea', n: 1, file: '01-idea.md', steps: ['explore', 'scope', 'summarize'] },
  { id: 'prd', n: 2, file: '02-prd.md', steps: ['clarify', 'write', 'review', 'polish'] },
  { id: 'design', n: 3, file: '03-design.md', steps: ['prototype', 'validate', 'link'] },
  { id: 'build', n: 4, file: '04-plan.md', steps: ['plan', 'setup', 'build'] },
  { id: 'iterate', n: 5, file: '05-validation.md', steps: ['validate', 'decisions', 'triage', 'loop'] },
  { id: 'ship', n: 6, file: '06-ship.md', steps: ['audit', 'remote', 'prepare', 'deploy', 'domain', 'record'] },
];

const STATUSES = ['not_started', 'in_progress', 'done', 'skipped_generated', 'not_applicable'];
const int = (v, fallback) => (Number.isInteger(v) && v >= 0 ? v : fallback);

function escapeHtml(value) {
  return String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function summarize(state) {
  if (!state || typeof state !== 'object' || !state.phases) throw new Error('state has no phases');
  const debtPhases = new Set((state.debt || []).map((d) => d.phase));
  const phases = PHASES.map((p) => {
    const ph = state.phases[p.id];
    if (!ph) throw new Error(`phase ${p.id} is missing`);
    if (!STATUSES.includes(ph.status)) throw new Error(`unknown status for phase ${p.id}`);
    const steps = ph.steps || {};
    const stepsDone = ph.status === 'done' || ph.status === 'not_applicable'
      ? p.steps.length
      : p.steps.filter((s) => steps[s] === 'done' || steps[s] === 'skipped').length;
    return {
      id: p.id,
      n: p.n,
      status: ph.status,
      stepsDone,
      stepsTotal: p.steps.length,
      debt: debtPhases.has(p.id) || ph.review === 'unreviewed',
    };
  });
  const flows = state.flows || [];
  return {
    currentPhase: state.currentPhase,
    phases,
    flows: {
      total: flows.length,
      covered: flows.filter((f) => (f.tasks || []).length > 0).length,
      validated: flows.filter((f) => f.validation === 'pass').length,
    },
    pendingDecisions: int(state.decisions?.pending, 0),
    cycle: int(state.cycle, 1) || 1,
  };
}

function missingText(state, phase, sum, t, cycle) {
  if (sum.status === 'not_applicable') return t.notNeeded;
  if (sum.status === 'done') return '';
  if (sum.status === 'skipped_generated') return t.reviewWith(`/builder:${phase.id}`);
  if (phase.id === 'build' && sum.status === 'in_progress') {
    const left = (state.tasks || []).filter((k) => k.status !== 'done' && k.cycle === cycle).map((k) => k.id);
    if (left.length) return `${t.tasksLeft}: ${left.join(', ')}`;
  }
  if (phase.id === 'iterate' && sum.status === 'in_progress') {
    const left = (state.flows || []).filter((f) => f.validation !== 'pass').map((f) => f.id);
    if (left.length) return `${t.flowsToValidate}: ${left.join(', ')}`;
  }
  const steps = state.phases[phase.id].steps || {};
  const pending = phase.steps.filter((s) => steps[s] !== 'done' && steps[s] !== 'skipped');
  return `${t.pendingSteps}: ${pending.map((s) => t.steps[s] || s).join(', ')}`;
}

function card(state, phase, sum, current, t, cycle) {
  const classes = ['card', `st-${sum.status}`];
  if (sum.status === 'not_applicable') classes.push('na');
  if (current) classes.push('current');
  const pct = Math.round((sum.stepsDone / sum.stepsTotal) * 100);
  const showFile = sum.status !== 'not_started' && sum.status !== 'not_applicable';
  const missing = missingText(state, phase, sum, t, cycle);
  return [
    `<article data-phase="${phase.id}" data-status="${sum.status}" class="${classes.join(' ')}">`,
    `<header><span class="num">${phase.n}</span><div><p class="eyebrow">${escapeHtml(t.phaseOf(phase.n))}</p><h2>${escapeHtml(t.phases[phase.id])}</h2></div></header>`,
    current ? `<p class="here">▲ ${escapeHtml(t.youAreHere)}</p>` : '',
    `<p class="status">${escapeHtml(t.status[sum.status] || sum.status)}</p>`,
    `<div class="bar" role="img" aria-label="${sum.stepsDone}/${sum.stepsTotal}"><span style="width:${pct}%"></span></div>`,
    showFile ? `<p class="file">${escapeHtml(t.deliverable)}: <a href="${phase.file}">${phase.file}</a></p>` : '',
    missing ? `<p class="missing">${escapeHtml(missing)}</p>` : '',
    sum.debt ? `<p class="debt-badge">${escapeHtml(t.unreviewed)}</p>` : '',
    '</article>',
  ].join('');
}

function flowTable(state, t) {
  const flows = state.flows || [];
  if (!flows.length) return `<section class="flows"><h3>${escapeHtml(t.flows)}</h3><p>${escapeHtml(t.noFlows)}</p></section>`;
  const rows = flows.map((f) => [
    `<tr class="v-${escapeHtml(f.validation)}">`,
    `<td>${escapeHtml(f.id)}</td>`,
    `<td>${escapeHtml(f.name)}</td>`,
    `<td>${escapeHtml((f.tasks || []).join(', '))}</td>`,
    `<td>${escapeHtml(t.validationStatus[f.validation] || f.validation)}</td>`,
    '</tr>',
  ].join(''));
  return [
    `<section class="flows"><h3>${escapeHtml(t.flows)}</h3>`,
    `<table><thead><tr><th>${escapeHtml(t.flow)}</th><th>${escapeHtml(t.name)}</th><th>${escapeHtml(t.tasks)}</th><th>${escapeHtml(t.validation)}</th></tr></thead>`,
    `<tbody>${rows.join('')}</tbody></table></section>`,
  ].join('');
}

function renderProgress(state, lang) {
  const t = strings(lang);
  const s = summarize(state);
  const cards = PHASES.map((p, i) => card(state, p, s.phases[i], p.id === s.currentPhase, t, s.cycle));
  return [
    `<header class="top"><p class="brand">${escapeHtml(t.title)}</p>`,
    `<h1>${escapeHtml(state.project?.name)}</h1>`,
    `<p class="meta">${escapeHtml(t.cycle)} ${s.cycle}</p></header>`,
    `<section class="board">${cards.join('')}<p class="loop" aria-hidden="true">${escapeHtml(t.loop)}</p></section>`,
    `<section class="totals"><p>${escapeHtml(t.covered(s.flows.covered, s.flows.total))}</p>`,
    `<p>${escapeHtml(t.validated(s.flows.validated, s.flows.total))}</p>`,
    `<p>${escapeHtml(t.decisionsPending(s.pendingDecisions))}</p></section>`,
    flowTable(state, t),
    `<footer class="next"><p>${escapeHtml(t.next)}: <code>/builder:next</code></p></footer>`,
  ].join('');
}

function renderError(lang) {
  const t = strings(lang);
  return `<section class="error"><h1>${escapeHtml(t.errorTitle)}</h1><p>${escapeHtml(t.errorBody)}</p></section>`;
}

// Deterministic "hand-drawn" rectangle outline: two jittered passes, seeded.
function prng(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function sketchPath(w, h, seed) {
  const rnd = prng(seed);
  const j = (n) => (rnd() - 0.5) * 2 * n;
  const f = (n) => Math.max(0, n).toFixed(1);
  const pass = (m) => {
    const pts = [
      [2 + j(m), 2 + j(m)], [w / 2 + j(m * 4), 2 + j(m)], [w - 2 + j(m), 2 + j(m)],
      [w - 2 + j(m), h / 2 + j(m * 4)], [w - 2 + j(m), h - 2 + j(m)], [w / 2 + j(m * 4), h - 2 + j(m)],
      [2 + j(m), h - 2 + j(m)], [2 + j(m), h / 2 + j(m * 4)], [2 + j(m), 2 + j(m)],
    ];
    return `M${f(pts[0][0])} ${f(pts[0][1])} ` + pts.slice(1).map(([x, y]) => `L${f(x)} ${f(y)}`).join(' ');
  };
  return `${pass(1.6)} ${pass(1.2)}`;
}


  var main = document.querySelector('main');
  var lang = (navigator.language || 'en').slice(0, 2);

  function draw() {
    var cards = document.querySelectorAll('.card');
    for (var i = 0; i < cards.length; i++) {
      var c = cards[i];
      var old = c.querySelector('svg.outline');
      if (old) old.remove();
      var w = c.offsetWidth, h = c.offsetHeight;
      var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      svg.setAttribute('class', 'outline');
      svg.setAttribute('aria-hidden', 'true');
      svg.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
      var path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('d', sketchPath(w, h, 10 + i));
      svg.appendChild(path);
      c.prepend(svg);
    }
  }

  try {
    var state = window.BUILDER_STATE;
    if (!state || typeof state !== 'object') throw new Error('no state');
    lang = (state.profile && state.profile.language) || lang;
    main.innerHTML = renderProgress(state, lang);
    document.documentElement.lang = String(lang).slice(0, 2);
    document.title = strings(lang).title + ' · ' + (state.project && state.project.name || '');
    draw();
    var t;
    window.addEventListener('resize', function () { clearTimeout(t); t = setTimeout(draw, 120); });
  } catch (e) {
    main.innerHTML = renderError(lang);
  }
})();
</script>
</body>
</html>
